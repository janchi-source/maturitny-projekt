{% extends 'base.html' %}

{% block title %}403 | Forbidden{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto text-center py-16">
    <div class="bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-border-dark shadow-sm p-8">
        <p class="text-xs font-black uppercase tracking-widest text-amber-500 mb-2">Error 403</p>
        <h2 class="text-3xl font-black tracking-tight mb-3">Access denied</h2>
        <p class="text-slate-500 dark:text-slate-400 mb-6">
            You do not have permission to view this page. Sign in with an account that has the required role,
            or return to the dashboard.
        </p>
        <div class="flex flex-wrap items-center justify-center gap-3">
            <a href="/" class="inline-flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg text-sm font-bold hover:bg-primary/90">
                <span class="material-symbols-outlined text-sm">home</span>
                Dashboard
            </a>
            <a href="/auth/login" class="inline-flex items-center gap-2 px-4 py-2 border border-slate-300 dark:border-border-dark rounded-lg text-sm font-bold text-slate-700 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-800">
                <span class="material-symbols-outlined text-sm">login</span>
                Sign in
            </a>
        </div>
    </div>
</section>
{% endblock %}
