{% macro modal(modal_id, title, confirm_text='Confirm', cancel_text='Cancel') %}
<div id="{{ modal_id }}" class="hidden fixed inset-0 z-[60]" data-modal>
    <div class="absolute inset-0 bg-black/60" data-modal-close></div>
    <div class="relative h-full w-full flex items-center justify-center p-4">
        <div class="w-full max-w-lg bg-white dark:bg-surface-dark border border-slate-200 dark:border-border-dark rounded-xl shadow-xl overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 dark:border-border-dark flex items-center justify-between">
                <h3 class="text-lg font-bold">{{ title }}</h3>
                <button type="button" class="p-1 rounded hover:bg-slate-100 dark:hover:bg-border-dark" data-modal-close>
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="px-5 py-4">
                {{ caller() if caller else '' }}
            </div>
            <div class="px-5 py-4 border-t border-slate-200 dark:border-border-dark flex justify-end gap-3">
                <button type="button" class="px-4 py-2 border border-slate-200 dark:border-border-dark rounded-lg text-sm font-bold hover:bg-slate-50 dark:hover:bg-border-dark/40" data-modal-close>{{ cancel_text }}</button>
                <button type="button" class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-bold hover:bg-primary/90">{{ confirm_text }}</button>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
