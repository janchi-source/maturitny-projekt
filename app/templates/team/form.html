{% extends 'base.html' %}

{% block title %}Edit Member | ProMat{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <h2 class="text-3xl font-black tracking-tight">Edit Member</h2>
        <p class="text-slate-500 dark:text-slate-400 font-medium">Update role for {{ user.username }}</p>
    </div>

    <section class="bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-border-dark shadow-sm p-5 sm:p-6">
        <form method="post" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block text-sm font-semibold mb-1">Username</label>
                <input type="text" value="{{ user.username }}" disabled class="w-full bg-slate-100 dark:bg-border-dark border border-slate-200 dark:border-border-dark rounded-lg px-3 py-2.5 text-sm opacity-80">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Email</label>
                <input type="text" value="{{ user.email }}" disabled class="w-full bg-slate-100 dark:bg-border-dark border border-slate-200 dark:border-border-dark rounded-lg px-3 py-2.5 text-sm opacity-80">
            </div>

            <div>
                <label for="role" class="block text-sm font-semibold mb-1">Role</label>
                <select id="role" name="role" class="w-full bg-slate-100 dark:bg-border-dark border border-slate-200 dark:border-border-dark rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary">
                    {% for role_value in role_values %}
                        <option value="{{ role_value }}" {% if user.role.value == role_value %}selected{% endif %}>{{ role_label_map.get(role_value, role_value|title) }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex gap-3">
                <button type="submit" class="px-5 py-2.5 bg-primary text-white rounded-lg text-sm font-bold hover:bg-primary/90">Save Role</button>
                <a href="{{ url_for('team.index') }}" class="px-5 py-2.5 border border-slate-200 dark:border-border-dark rounded-lg text-sm font-bold hover:bg-slate-50 dark:hover:bg-border-dark/50">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
