{% macro stats_card(title, value, icon='folder_open', trend='+0%', trend_icon='trending_up', icon_color='text-primary', trend_color='text-emerald-500') %}
<div class="bg-white dark:bg-surface-dark rounded-xl p-6 border border-slate-200 dark:border-border-dark shadow-sm">
    <div class="flex justify-between items-start mb-4">
        <p class="text-slate-500 dark:text-slate-400 font-bold text-sm uppercase tracking-wider">{{ title }}</p>
        <span class="material-symbols-outlined {{ icon_color }}">{{ icon }}</span>
    </div>
    <div class="flex items-end gap-3">
        <p class="text-4xl font-bold tracking-tight leading-none">{{ value }}</p>
        <p class="{{ trend_color }} text-sm font-bold flex items-center mb-1">
            <span class="material-symbols-outlined text-sm">{{ trend_icon }}</span>
            {{ trend }}
        </p>
    </div>
</div>
{% endmacro %}
