{% extends 'base.html' %}

{% block title %}Upload Document | ProMat{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <h2 class="text-3xl font-black tracking-tight">Upload Document</h2>
        <p class="text-slate-500 dark:text-slate-400 font-medium">Accepted formats: PDF and DOCX</p>
    </div>

    <section class="bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-border-dark shadow-sm p-5 sm:p-6">
        <form id="upload-form" method="post" action="{{ url_for('documents.upload') }}" enctype="multipart/form-data" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div id="drop-zone" class="border-2 border-dashed border-slate-300 dark:border-border-dark rounded-xl p-8 text-center bg-slate-50 dark:bg-border-dark/20">
                <p class="font-bold">Drag and drop a file here</p>
                <p class="text-sm text-slate-500 mt-1">or click to select a file</p>
                <input id="file-input" name="file" type="file" accept=".pdf,.docx" required class="mt-4 block w-full text-sm file:mr-4 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-primary file:text-white hover:file:bg-primary/90">
            </div>

            <div>
                <label for="project_id" class="block text-sm font-semibold mb-1">Project</label>
                <select id="project_id" name="project_id" required class="w-full bg-slate-100 dark:bg-border-dark border border-slate-200 dark:border-border-dark rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary">
                    <option value="">Select project</option>
                    {% for project in projects %}
                        <option value="{{ project.id }}">{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="tags" class="block text-sm font-semibold mb-1">Tags</label>
                <input id="tags" name="tags" type="text" placeholder="e.g. contract, finance, q1" class="w-full bg-slate-100 dark:bg-border-dark border border-slate-200 dark:border-border-dark rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1 text-xs text-slate-500">
                    <span>Upload progress</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="w-full bg-slate-100 dark:bg-border-dark h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-primary h-full rounded-full" style="width: 0%"></div>
                </div>
            </div>

            <button type="submit" class="px-5 py-2.5 bg-primary text-white rounded-lg text-sm font-bold hover:bg-primary/90">Upload</button>
        </form>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('upload-form');
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    const setProgress = (percent) => {
        progressBar.style.width = `${percent}%`;
        progressText.textContent = `${percent}%`;
    };

    ['dragenter', 'dragover'].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
            event.preventDefault();
            dropZone.classList.add('ring-2', 'ring-primary');
        });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
        dropZone.addEventListener(eventName, (event) => {
            event.preventDefault();
            dropZone.classList.remove('ring-2', 'ring-primary');
        });
    });

    dropZone.addEventListener('drop', (event) => {
        const files = event.dataTransfer.files;
        if (files && files.length > 0) {
            fileInput.files = files;
        }
    });

    form.addEventListener('submit', (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', form.action, true);

        xhr.upload.onprogress = (event) => {
            if (event.lengthComputable) {
                const percent = Math.round((event.loaded / event.total) * 100);
                setProgress(percent);
            }
        };

        xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 400) {
                const target = xhr.responseURL || '{{ url_for('documents.index') }}';
                window.location.href = target;
            }
        };

        xhr.send(formData);
    });
});
</script>
{% endblock %}
