{% extends 'base.html' %}

{% block title %}404 | Page Not Found{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto text-center py-16">
    <div class="bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-border-dark shadow-sm p-8">
        <p class="text-xs font-black uppercase tracking-widest text-primary mb-2">Error 404</p>
        <h2 class="text-3xl font-black tracking-tight mb-3">Page not found</h2>
        <p class="text-slate-500 dark:text-slate-400 mb-6">The page you requested does not exist or has been moved.</p>
        <a href="/" class="inline-flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg text-sm font-bold hover:bg-primary/90">
            <span class="material-symbols-outlined text-sm">home</span>
            Back to Dashboard
        </a>
    </div>
</section>
{% endblock %}
