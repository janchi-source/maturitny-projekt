{% extends 'base.html' %}

{% block title %}Edit Role Rights | ProMat{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <h2 class="text-3xl font-black tracking-tight">Edit Role Rights</h2>
        <p class="text-slate-500 dark:text-slate-400 font-medium">Configure permissions for role: {{ role.name }}</p>
    </div>

    <section class="bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-border-dark shadow-sm p-5 sm:p-6">
        <form method="post" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            {% for right_key in rights_keys %}
            <label class="flex items-center justify-between gap-3 rounded-lg border border-slate-200 dark:border-border-dark px-3 py-2.5">
                <span>
                    <span class="block text-sm font-semibold">{{ rights_labels[right_key] }}</span>
                    <span class="block text-xs text-slate-500 font-mono">{{ right_key }}</span>
                </span>
                <input
                    type="checkbox"
                    name="right_{{ right_key }}"
                    {% if effective_rights.get(right_key) %}checked{% endif %}
                    {% if is_admin_system_role %}disabled{% endif %}
                    class="h-4 w-4 rounded border-slate-300 text-primary focus:ring-primary"
                >
            </label>
            {% endfor %}

            <div class="flex gap-3 pt-2">
                {% if not is_admin_system_role %}
                <button type="submit" class="px-5 py-2.5 bg-primary text-white rounded-lg text-sm font-bold hover:bg-primary/90">Save Rights</button>
                {% endif %}
                <a href="{{ url_for('team.manage_roles') }}" class="px-5 py-2.5 border border-slate-200 dark:border-border-dark rounded-lg text-sm font-bold hover:bg-slate-50 dark:hover:bg-border-dark/50">Back</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
