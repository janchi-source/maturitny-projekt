{% extends 'base.html' %}

{% block title %}Manage Role Names | ProMat{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <h2 class="text-3xl font-black tracking-tight">Manage Role Names</h2>
        <p class="text-slate-500 dark:text-slate-400 font-medium">Customize the display names for each role</p>
    </div>

    <section class="bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-border-dark shadow-sm p-5 sm:p-6">
        <form method="post" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            {% for role_value, current_label in roles %}
            <div>
                <label for="label_{{ role_value }}" class="block text-sm font-semibold mb-1">
                    <span class="text-slate-400 text-xs font-mono mr-1">{{ role_value }}</span>
                </label>
                <input type="text" id="label_{{ role_value }}" name="label_{{ role_value }}"
                    value="{{ current_label }}" required
                    class="w-full bg-slate-100 dark:bg-border-dark border border-slate-200 dark:border-border-dark rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:outline-none">
            </div>
            {% endfor %}

            <div class="flex gap-3 pt-2">
                <button type="submit" class="px-5 py-2.5 bg-primary text-white rounded-lg text-sm font-bold hover:bg-primary/90">Save</button>
                <a href="{{ url_for('team.index') }}" class="px-5 py-2.5 border border-slate-200 dark:border-border-dark rounded-lg text-sm font-bold hover:bg-slate-50 dark:hover:bg-border-dark/50">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
